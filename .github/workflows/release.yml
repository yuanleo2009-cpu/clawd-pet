# 推送 v* tag 時：在 GitHub 的 Windows 和 Mac 機器上跑測試、打包，並建立 Release（附安裝檔與 SHA-256）。
# Release 說明的「更新內容」取自 CHANGELOG.md；沒寫這一版的話會在打包前就失敗。
# 安裝檔是從公開的 commit 打包出來的，過程記錄在 Actions 頁面，任何人都能檢查。
# 也可以在 Actions 頁面手動執行（workflow_dispatch）：只測試、打包、上傳成 artifact，不建立 Release。
#
# macOS：在 Apple 晶片和 Intel 兩種 Mac 上各打包一次，並真的把 App 打開來測試；
# 再換另一個版本的 macOS（15 / 26）從 DMG 安裝、打開一次。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Install Python packages
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements-dev.txt

      - name: Unit tests
        run: .\.venv\Scripts\python.exe -m unittest discover -s tests -v

      - name: Check tag matches services/version.py and CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/')
        env:
          PYTHONIOENCODING: utf-8
        run: |
          $v = (.\.venv\Scripts\python.exe -c "from services.version import __version__; print(__version__)").Trim()
          if ("v$v" -ne $env:GITHUB_REF_NAME) { throw "tag $env:GITHUB_REF_NAME does not match version v$v" }
          .\.venv\Scripts\python.exe tools\release_notes.py $v --check
          if ($LASTEXITCODE -ne 0) { throw "CHANGELOG.md has no section for $v" }

      - name: Build
        run: .\build.ps1

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            dist/ClawdPet-Setup-*.exe
            dist/ClawdPet-Setup-*.exe.sha256

  # 在 Intel Mac 上打包「通用版」（一個 App 同時含 Apple 晶片和 Intel 的程式碼），並真的打開測試
  macos:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5

      - name: Install universal2 Python from python.org
        run: |
          curl -sSLo py.pkg https://www.python.org/ftp/python/3.13.15/python-3.13.15-macos11.pkg
          sudo installer -pkg py.pkg -target /
          /Library/Frameworks/Python.framework/Versions/3.13/bin/python3 --version

      - name: Install Python packages
        run: |
          /Library/Frameworks/Python.framework/Versions/3.13/bin/python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt

      - name: Unit tests
        run: .venv/bin/python -m unittest discover -s tests -v

      - name: Build universal ClawdPet.app and DMG
        env:
          CLAWDPET_TARGET_ARCH: universal2
        run: bash build_mac.sh

      - name: Check both architectures are inside
        run: |
          archs="$(lipo -archs dist/ClawdPet.app/Contents/MacOS/ClawdPet)"
          echo "built for: $archs"
          [[ "$archs" == *x86_64* && "$archs" == *arm64* ]]

      - name: Launch the real app on this Mac
        run: bash tools/mac_smoke_test.sh dist/ClawdPet.app screenshot-build-macos15-intel.png

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: mac-universal
          path: |
            dist/*.dmg
            dist/*.dmg.sha256

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-build-macos15-intel
          path: screenshot-*.png
          if-no-files-found: ignore

  # 照使用者的方式安裝：打開 DMG → 把 App 拖進「應用程式」→ 打開
  # macos-26-intel 一定要通過；Apple 晶片（macos-15）的機器常常排不到，所以失敗也不擋發布
  macos-install-test:
    needs: macos
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26-intel
            name: macos26-intel
            optional: false
          - runner: macos-15
            name: macos15-applechip
            optional: true
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.optional }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          name: mac-universal
          path: dl

      - name: Verify checksum, open DMG, copy to /Applications
        run: |
          cd dl
          dmg="$(ls *.dmg)"
          want="$(cut -d' ' -f1 "$dmg.sha256")"
          got="$(shasum -a 256 "$dmg" | awk '{print toupper($1)}')"
          [ "$want" = "$got" ] || { echo "checksum mismatch"; exit 1; }
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/clawd "$dmg"
          ls -la /tmp/clawd
          test -f "/tmp/clawd/安裝說明.txt"
          test -L "/tmp/clawd/應用程式"
          cp -R /tmp/clawd/ClawdPet.app /Applications/
          hdiutil detach /tmp/clawd

      - name: Launch the installed app
        run: bash tools/mac_smoke_test.sh /Applications/ClawdPet.app "screenshot-install-${{ matrix.name }}.png"

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-install-${{ matrix.name }}
          path: screenshot-*.png
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos, macos-install-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          path: dl
          pattern: "{windows,mac-*}"
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONIOENCODING: utf-8
        run: |
          # Release 說明 = CHANGELOG.md 裡這一版的「更新內容」+ 各平台安裝說明 + SHA-256 + 打包紀錄連結
          ls -la dl
          setup="$(ls dl/ClawdPet-Setup-*.exe)"
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          python3 tools/release_notes.py "$GITHUB_REF_NAME" --setup "$setup" --mac dl/*.dmg \
            --run-url "$run" --repo "$GITHUB_REPOSITORY" --out release-notes.md
          gh release create "$GITHUB_REF_NAME" dl/ClawdPet-Setup-*.exe dl/ClawdPet-Setup-*.exe.sha256 \
            dl/*.dmg dl/*.dmg.sha256 --title "Clawd 桌寵 $GITHUB_REF_NAME" --notes-file release-notes.md
