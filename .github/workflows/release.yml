# 推送 v* tag 時：在 GitHub 的 Windows 機器上跑測試、打包，並建立 Release（附安裝檔與 SHA-256）。
# 安裝檔是從公開的 commit 打包出來的，過程記錄在 Actions 頁面，任何人都能檢查。
# 也可以在 Actions 頁面手動執行（workflow_dispatch）：只打包、上傳成 artifact，不建立 Release。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Install Python packages
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements-dev.txt

      - name: Unit tests
        run: .\.venv\Scripts\python.exe -m unittest discover -s tests -v

      - name: Check tag matches services/version.py
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $v = (.\.venv\Scripts\python.exe -c "from services.version import __version__; print(__version__)").Trim()
          if ("v$v" -ne $env:GITHUB_REF_NAME) { throw "tag $env:GITHUB_REF_NAME does not match version v$v" }

      - name: Build
        run: .\build.ps1

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: ClawdPet-Setup
          path: |
            dist/ClawdPet-Setup-*.exe
            dist/ClawdPet-Setup-*.exe.sha256

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = Get-Item dist\ClawdPet-Setup-*.exe
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash
          $run = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $notes = @"
          下載 **$($setup.Name)**，雙擊安裝即可（Windows 10/11，64 位元，不需要系統管理員權限）。

          安裝檔沒有數位簽章，Windows 可能顯示「Windows 已保護你的電腦」：點「其他資訊」→「仍要執行」。

          **SHA-256**：``$hash``
          （PowerShell 驗證：``Get-FileHash .\$($setup.Name) -Algorithm SHA256``）

          此安裝檔由 GitHub Actions 從這個 tag 的原始碼自動打包：$run

          > 非官方的粉絲作品，與 Anthropic 無關。程式碼為 MIT 授權；Clawd 形象與 Claude 商標歸 Anthropic 所有，不在授權範圍內。
          "@
          gh release create $env:GITHUB_REF_NAME $setup.FullName "$($setup.FullName).sha256" `
            --title "Clawd 桌寵 $env:GITHUB_REF_NAME" --notes $notes --generate-notes
